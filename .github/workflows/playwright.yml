name: Playwright Tests
on:
  push:
    branches:
        - main
  pull_request:
    branches:
        - main
jobs:
  playwright:
    name: 'Playwright Tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          pip-install: 'fastapi pydantic websockets msgpack uvicorn rclpy'
      - name: Install Playwright Dependencies
        run: cd teleoperation && npm install && npx playwright install
      - name: Install Frontend Dependencies
        run: cd teleoperation/basestation_gui/frontend && npm install
      - name: Run tests
        run: cd teleoperation && npx playwright test tests/ui/