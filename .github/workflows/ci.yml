name: CI
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - integration
  push:
    branches:
      - main
      - integration

jobs:
  style:
    name: Style Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          pip-install: 'black==26.5.1 mypy==1.11.2'
      - name: Install clang-format
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository 'deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main'
          sudo apt-get update
          sudo apt-get install -y clang-format-18
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - uses: oven-sh/setup-bun@v2
      - name: Install Frontend Dependencies
        run: cd teleoperation/basestation_gui/frontend && bun install
      - name: Run Style Check
        run: ./style.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: style
    container:
      image: umrover1/ros2:latest
      options: --user root
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Dawn Cache
        uses: actions/cache@v5
        with:
          path: deps/dawn-prebuilt
          key: dawn-${{ hashFiles('tools/setup_dawn.sh') }}
      - name: Setup Dawn
        run: ./tools/setup_dawn.sh
      - name: Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2.23
      - name: Build
        shell: bash
        env:
          MROVER_BUILD_JOBS: 2
        run: |
          source /opt/ros/humble/setup.bash
          ./build_ci.sh
