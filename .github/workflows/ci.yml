name: CI
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - integration
  push:
    branches:
      - main
      - integration
jobs:
  style:
    name: Style Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Python Tools
        run: pip install black==26.5.1 mypy==1.11.2
      - name: Install clang-format
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-18 main'
          sudo apt-get update
          sudo apt-get install -y clang-format-18
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - uses: oven-sh/setup-bun@v2
      - name: Install Frontend Dependencies
        run: cd teleoperation/basestation_gui/frontend && bun install
      - name: Run Style Check
        run: ./style.sh

  build-native:
    name: Build (native Ubuntu 24)
    runs-on: ubuntu-24.04
    container:
      image: kevinjin0420/mrover-ci:latest
      # by pass github's dubious ownership check
      options: --user root
    needs: style
    env:
      # directory owned by mrover so CI can write to it and use caching
      HOME: /home/mrover
    steps:
      - uses: actions/checkout@v7
      - name: Checkout ESW Submodule
        # Use this instead of `submodules: true`/`recursive` to avoid checking out all top-level submodules
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}" && git submodule update --init esw/fw
      - name: Dawn Cache
        uses: actions/cache@v6
        with:
          path: deps/dawn-prebuilt
          key: dawn-${{ hashFiles('scripts/setup_dawn.sh') }}
      - name: Setup Dawn
        run: ./scripts/setup_dawn.sh
      - name: Pip Cache
        uses: actions/cache@v6
        with:
          path: /home/mrover/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml', 'esw/fw/tools/pyproject.toml') }}
          restore-keys: |
            pip-
      - name: Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2.23
      - name: Build
        shell: bash
        run: source /opt/ros/jazzy/setup.bash && source /home/mrover/mrover-ros2/venv/bin/activate && ./build.sh Release
