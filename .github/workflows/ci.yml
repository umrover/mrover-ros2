name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - integration
jobs:
  style:
    name: Style Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install Python style tools
        run: pip install black==26.5.1 mypy==1.11.2
      - name: Install clang-format
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-18 main'
          sudo apt-get update
          sudo apt-get install -y clang-format-18
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - uses: oven-sh/setup-bun@v2
      - name: Install Frontend Dependencies
        run: cd teleoperation/basestation_gui/frontend && bun install
      - name: Run Style Check
        run: ./style.sh

  build-portable:
    name: Build (pixi ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: style
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            name: Linux x86_64
          - os: macos-14
            name: macOS arm64
          - os: macos-13
            name: macOS x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Dawn Cache
        uses: actions/cache@v6
        with:
          path: deps/dawn-prebuilt
          key: dawn-${{ matrix.os }}-${{ hashFiles('scripts/setup_dawn.sh') }}
      - name: Setup Dawn
        run: ./scripts/setup_dawn.sh
      - name: Imgui Cache
        uses: actions/cache@v6
        with:
          path: deps/imgui-src
          key: imgui-${{ hashFiles('scripts/setup_imgui.sh') }}
      - name: Setup Imgui
        run: ./scripts/setup_imgui.sh
      - name: Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.os }}
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          activate-environment: true
          cache: true
      - name: Build
        run: ./build.sh

  build-native:
    name: Build (native Ubuntu 24)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    container:
      image: umrover1/ros2-ci:noble
      # by pass github's dubious ownership check
      options: --user root
    needs: style
    env:
      # directory owned by mrover so CI can write to it and use caching
      # this is new for ubuntu 24
      HOME: /home/mrover
    defaults:
      run:
        working-directory: src/mrover
    steps:
      - uses: actions/checkout@v7
        # Re-enable lfs: "true" when we put the simulator in the CI pipeline.
        with:
          path: src/mrover
      - name: Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2.24
      - name: Dawn Cache
        uses: actions/cache@v6
        with:
          path: src/mrover/deps/dawn-prebuilt
          key: dawn-${{ hashFiles('src/mrover/scripts/setup_dawn.sh') }}
      - name: Setup Dawn
        run: ./scripts/setup_dawn.sh
      - name: Manif Cache
        uses: actions/cache@v6
        with:
          path: src/mrover/deps/manif-src
          key: manif-${{ hashFiles('src/mrover/scripts/setup_manif.sh') }}
      - name: Setup Manif
        run: ./scripts/setup_manif.sh
      - name: Imgui Cache
        uses: actions/cache@v6
        with:
          path: src/mrover/deps/imgui-src
          key: imgui-${{ hashFiles('src/mrover/scripts/setup_imgui.sh') }}
      - name: Setup Imgui
        run: ./scripts/setup_imgui.sh
      - name: Pip Cache
        uses: actions/cache@v6
        with:
          path: /home/mrover/.cache/pip
          key: pip-${{ hashFiles('src/mrover/pyproject.toml', 'src/mrover/esw/fw/tools/pyproject.toml') }}
          restore-keys: |
            pip-
      - name: Build
        shell: bash
        run: source /opt/ros/jazzy/setup.bash && source /home/mrover/ros2_ws/src/mrover/venv/bin/activate && ./build.sh Release
