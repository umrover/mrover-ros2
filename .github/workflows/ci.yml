name: CI
on:
  pull_request:
    branches:
      - main
      - integration
  push:
    branches:
      - main
      - integration

jobs:
  style:
    name: Style Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: style
          activate-environment: style
          cache: true
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('teleoperation/basestation_gui/frontend/bun.lockb') }}
          restore-keys: bun-
      - name: Style Check
        run: ./style.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Dawn Cache
        uses: actions/cache@v4
        with:
          path: deps/dawn-prebuilt
          key: dawn-${{ hashFiles('tools/setup_dawn.sh') }}
      - name: Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2.23
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          activate-environment: mrover
          cache: true
      - name: Build
        env:
          MROVER_BUILD_JOBS: 2
        run: ./build.sh
