# All units are in SI
# ===================
# Time:     second, hz
# Angle:    radian
# Distance: meter

navigation:
  ros__parameters:
    pub_path_rate: 1.0
    path_hist_size: 100
    display_markers: true

    # How many state machine iterations per second
    update_rate: 60.0

    # How long it takes to forget about a target
    # Useful if the rover turns away from the target for a brief moment
    # Or if there was an ephemeral false positive detection
    target_expiration_duration: 60.0

    # location frame references
    world_frame: "map"
    rover_frame: "base_link"
    
    state_machine:
      structure_pub_topic: "nav_structure"
      structure_update_rate_hz: 1.0
      state_pub_topic: "nav_state"
      state_update_rate_hz: 10.0

    pure_pursuit:
      min_lookahead_distance: 0.4
      max_lookahead_distance: 1.5
      use_pure_pursuit: true

    costmap:
      custom_costmap: false
      use_costmap: false
      costmap_thresh: 0.25
      initial_inflation_radius: 1.0

    backup:
      stop_threshold: 0.2
      drive_forward_threshold: 0.34
      backup_distance: 2.5
      wait_time: 3.0

    drive:
      max_driving_effort: 1.0
      min_driving_effort: -1.0
      max_turning_effort: 1.0
      min_turning_effort: -1.0
      turning_p: 3.0
      driving_p: 20.0
      lookahead_distance: 1.0

    smoothing:
      use_relaxation: true
      use_interpolation: true

    waypoint:
      stop_threshold: 0.5
      drive_forward_threshold: 0.34
      no_search_wait_time: 10.0

    long_range:
      distance_ahead: 3.0
      bearing_expiration_duration: 0.5

    search:
      object_stop_threshold: 3.0
      stop_threshold: 0.5
      drive_forward_threshold: 0.34
      coverage_radius: 20.0
      segments_per_rotation: 16
      distance_between_spirals: 3.0
      max_segment_length: 1.0
      traversable_cost: 5.0
      angle_thresh: 0.0872665 #pi/36 radians / 5 degrees
      update_delay: 3.0

    image_targets:
      increment_weight: 5
      decrement_weight: 1
      max_hits: 10
      
    single_tag:
      stop_threshold: 1.0
    
    recovery:
      stop_threshold: 0.2
      drive_forward_threshold: 0.34
      recovery_distance: 2.0
      give_up_time: 10.0

stuck_detector:
  ros__parameters:
    # How many readings to consider the rover stuck
    # NOTE(quintin): This is probably bad since it depends on the data publishing rate...
    #                May want to refactor this to be time based
    window_size: 30
    # How long to wait until the stuck detection can trigger again after the last one
    post_recovery_grace_period: 5.0
    # If the rover is being commanded to move, it must be below both of these thresholds to be considered stuck
    angular_vel_thresh: 0.08
    linear_vel_thresh: 0.16
    # Clear the window if the time since last data is greater than this
    data_watchdog_timeout: 1.0

custom_costmap:
  ros__parameters:
    size: 40
    resolution: 1.0
