# All units are in SI
# ===================
# Time:     second, hz
# Angle:    radian
# Distance: meter
#
# NOTE: mars terrain collision is the convex hull of the decimated mesh (a MuJoCo
# limitation for non-convex meshes); revisit with a heightfield if terrain contact matters.

objects:
  rover:
    uri: mjcf/rover.xml
    position: [ 0.0, 0.0, 0.5 ]
  mars_world:
    uri: mjcf/mars.xml
    fixed: true
