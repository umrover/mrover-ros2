# All units are in SI
# ===================
# Time:     second, hz
# Angle:    radian
# Distance: meter

simulator:
  ros__parameters:
    sim_map: "default_map.yaml"        # map under config/simulator/
    target_update_rate: 100.0          # hz
    motor_timeout: 100                 # ms; stale velocity/throttle commands stop drifting
    mallet_distance_threshold: 3.0     # m; publish mallet ImageTarget within this range
    bottle_distance_threshold: 3.0     # m; publish bottle ImageTarget within this range
