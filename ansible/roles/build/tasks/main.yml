- name: Add LLVM APT Key
  become: true
  ansible.builtin.get_url:
    url: https://apt.llvm.org/llvm-snapshot.gpg.key
    dest: /usr/share/keyrings/llvm-archive-keyring.asc
    mode: '0644'

# Allows us to install LLVM tools
- name: Add LLVM APT List
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.asc] https://apt.llvm.org/{{ ubuntu_release }}/ llvm-toolchain-{{ ubuntu_release }}-18 main"
    filename: llvm

- name: Add ROS APT Key
  become: true
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ros/rosdistro/master/ros.key
    dest: /usr/share/keyrings/ros-archive-keyring.gpg
    mode: '0644'

- name: Add ROS APT List
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu {{ ubuntu_release }} main"
    filename: ros

- name: Sync APT Preferences
  become: true
  synchronize:
    src: files/apt-preferences/
    dest: /etc/apt/preferences.d
    recursive: true

- name: Upgrade APT Packages
  become: true
  ansible.builtin.apt:
    cache_valid_time: 604800
    state: present
    upgrade: yes

- name: Install APT Packages
  become: true
  ansible.builtin.apt:
    cache_valid_time: 604800
    state: present
    name:
      - zsh
      - fzf
      - sudo
      - cmake
      - ccache # Caches intermediate build files, speeds up compilation over time
      - ninja-build # Faster than make
      - tmux
      - htop
      - curl
      - unzip
      - rsync
      - shellcheck
      - python3-pip
      - python3-dev
      - python3-venv
      - python3-rosdep
      - clang-18
      - clangd-18
      - clang-tidy-18
      - clang-format-18
      - lld-18
      - lldb-18
      - gcc-13
      - g++-13
      - libbullet-dev
      - libglfw3-dev
      - libx11-xcb-dev
      - libnl-3-dev
      - libnl-route-3-dev
      - libtbb-dev
      - libassimp-dev
      - libeigen3-dev
      - libopencv-dev
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
      - vainfo
      - x264
      - ros-jazzy-ros-base
      - ros-jazzy-rviz2
      - ros-jazzy-xacro
      - ros-jazzy-magic-enum
      - ros-jazzy-rtcm-msgs
      - ros-jazzy-dynamixel-sdk
      # TODO (ali): why does this need to be installed manually
      - libboost-dev
      - qt6-base-dev
      - qt6-multimedia-dev

- name: Install manifpy
  become: true
  ansible.builtin.pip:
    name: "git+https://github.com/artivis/manif.git"
    extra_args: "--break-system-packages"

- name: Download prebuilt MuJoCo
  ansible.builtin.command: ./scripts/setup_mujoco.sh
  args:
    chdir: "{{ mrover_repo }}"

- name: Initialize rosdep
  become: true
  ansible.builtin.command: rosdep init
  args:
    # This command will be skipped if this file already exists
    creates: /etc/ros/rosdep/sources.list.d/20-default.list

- name: Update rosdep
  ansible.builtin.command: rosdep update

# - name: Install ROS Packages
#   # command: rosdep install --from-paths {{ ros2_workspace }}/src --ignore-src -y --rosdistro={{ ros_distro }}

- name: Set G++ 13 as Default
  become: true
  alternatives:
    name: g++
    path: /usr/bin/g++-13
    link: /usr/bin/g++
    priority: 130

- name: Set GCC 13 as Default
  become: true
  alternatives:
    name: gcc
    path: /usr/bin/gcc-13
    link: /usr/bin/gcc
    priority: 130

- name: Set clang++18 as Default
  become: true
  alternatives:
    name: clang++
    path: /usr/bin/clang++-18
    link: /usr/bin/clang++
    priority: 180

- name: Set clang-18 as Default
  become: true
  alternatives:
    name: clang
    path: /usr/bin/clang-18
    link: /usr/bin/clang
    priority: 180

- name: Set clangd 18 as Default
  become: true
  alternatives:
    name: clangd
    path: /usr/bin/clangd-18
    link: /usr/bin/clangd
    priority: 180

- name: Set LLD 18 as Default
  become: true
  alternatives:
    name: lld
    path: /usr/bin/lld-18
    link: /usr/bin/lld
    priority: 180

- name: Set clang-tidy 18 as Default
  become: true
  alternatives:
    name: clang-tidy
    path: /usr/bin/clang-tidy-18
    link: /usr/bin/clang-tidy
    priority: 180

- name: Setup Python Virtual Environment
  ansible.builtin.pip:
    name:
      # Installs from pyproject.toml
      - "{{ mrover_repo }}[dev]"
    virtualenv: "{{ mrover_repo }}/venv"
    virtualenv_command: /usr/bin/python3 -m venv

- name: Add Google Chrome apt key
  become: true
  ansible.builtin.get_url:
    url: https://dl.google.com/linux/linux_signing_key.pub
    dest: /usr/share/keyrings/google-chrome.asc
    mode: '0644'

- name: Add Google Chrome apt repo
  become: true
  ansible.builtin.apt_repository:
    filename: google-chrome
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.asc] https://dl.google.com/linux/chrome/deb/ stable main"

- name: Install Google Chrome
  become: true
  ansible.builtin.apt:
    state: present
    name: google-chrome-stable

- name: Download Bun installer
  ansible.builtin.get_url:
    url: https://bun.sh/install
    dest: /tmp/bun_install.sh
    mode: '0755'

- name: Install or Upgrade Bun
  ansible.builtin.shell: /tmp/bun_install.sh
  args:
    executable: /bin/bash
  environment:
    BUN_INSTALL: "{{ ansible_env.HOME }}/.bun"

- name: Install Bun Packages
  ansible.builtin.command: "{{ ansible_env.HOME }}/.bun/bin/bun install"
  args:
    chdir: "{{ mrover_repo }}/teleoperation/basestation_gui/frontend"
