# https://github.com/ansible/ansible/issues/85536
- name: Allow sudo credential cache across ansible's detached sessions
  become: true
  ansible.builtin.copy:
    dest: /etc/sudoers.d/mrover-timestamp-type
    content: "Defaults timestamp_type=global\n"
    mode: '0440'
    validate: 'visudo -cf %s'

- name: Install python3-debian
  become: true
  ansible.builtin.apt:
    name: python3-debian
    state: present

# Allows us to install LLVM tools
- name: Add LLVM APT Repo
  become: true
  ansible.builtin.deb822_repository:
    name: llvm
    types: deb
    uris: "https://apt.llvm.org/{{ ubuntu_release }}/"
    suites: "llvm-toolchain-{{ ubuntu_release }}-18"
    components: main
    signed_by: https://apt.llvm.org/llvm-snapshot.gpg.key
  register: llvm_repo

- name: Add ROS APT Repo
  become: true
  ansible.builtin.deb822_repository:
    name: ros
    types: deb
    uris: http://packages.ros.org/ros2/ubuntu
    suites: "{{ ubuntu_release }}"
    components: main
    signed_by: https://raw.githubusercontent.com/ros/rosdistro/master/ros.key
  register: ros_repo

- name: Sync APT Preferences
  become: true
  synchronize:
    src: files/apt-preferences/
    dest: /etc/apt/preferences.d
    recursive: true

# deb822_repository doesn't call apt update, do so manually
- name: Update APT Cache if Repos Changed
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: llvm_repo.changed or ros_repo.changed

- name: Upgrade APT Packages
  become: true
  ansible.builtin.apt:
    cache_valid_time: 604800
    state: present
    upgrade: yes

- name: Install APT Packages
  become: true
  ansible.builtin.apt:
    cache_valid_time: 604800
    state: present
    name:
      - zsh
      - fzf
      - sudo
      - cmake
      - ccache # Caches intermediate build files, speeds up compilation over time
      - ninja-build # Faster than make
      - tmux
      - htop
      - curl
      - unzip
      - rsync
      - shellcheck
      - python3-pip
      - python3-dev
      - python3-venv
      - python3-rosdep
      - clang-18
      - clangd-18
      - clang-tidy-18
      - clang-format-18
      - lld-18
      - lldb-18
      - gcc-13
      - g++-13
      - libbullet-dev
      - libglfw3-dev
      - libx11-xcb-dev
      - libnl-3-dev
      - libnl-route-3-dev
      - libtbb-dev
      - libassimp-dev
      - libeigen3-dev
      - libopencv-dev
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
      - vainfo
      - x264
      - ros-jazzy-ros-base
      - ros-jazzy-rviz2
      - ros-jazzy-xacro
      - ros-jazzy-magic-enum
      - ros-jazzy-rtcm-msgs
      - ros-jazzy-dynamixel-sdk
      # TODO (ali): why does this need to be installed manually
      - libboost-dev
      - qt6-base-dev
      - qt6-multimedia-dev

- name: Install manifpy
  become: true
  ansible.builtin.command: pip install --break-system-packages "git+https://github.com/artivis/manif.git@0.0.5"

- name: Download prebuilt Dawn
  ansible.builtin.command: ./scripts/setup_dawn.sh
  args:
    chdir: "{{ mrover_repo }}"

- name: Download manif source
  ansible.builtin.command: ./scripts/setup_manif.sh
  args:
    chdir: "{{ mrover_repo }}"

- name: Download imgui source
  ansible.builtin.command: ./scripts/setup_imgui.sh
  args:
    chdir: "{{ mrover_repo }}"

- name: Initialize rosdep
  become: true
  ansible.builtin.command: rosdep init
  args:
    # This command will be skipped if this file already exists
    creates: /etc/ros/rosdep/sources.list.d/20-default.list

- name: Update rosdep
  ansible.builtin.command: rosdep update

- name: Set G++ 13 as Default
  become: true
  alternatives:
    name: g++
    path: /usr/bin/g++-13
    link: /usr/bin/g++
    priority: 130

- name: Set GCC 13 as Default
  become: true
  alternatives:
    name: gcc
    path: /usr/bin/gcc-13
    link: /usr/bin/gcc
    priority: 130

- name: Set clang++18 as Default
  become: true
  alternatives:
    name: clang++
    path: /usr/bin/clang++-18
    link: /usr/bin/clang++
    priority: 180

- name: Set clang-18 as Default
  become: true
  alternatives:
    name: clang
    path: /usr/bin/clang-18
    link: /usr/bin/clang
    priority: 180

- name: Set clangd 18 as Default
  become: true
  alternatives:
    name: clangd
    path: /usr/bin/clangd-18
    link: /usr/bin/clangd
    priority: 180

- name: Set LLD 18 as Default
  become: true
  alternatives:
    name: lld
    path: /usr/bin/lld-18
    link: /usr/bin/lld
    priority: 180

- name: Set clang-tidy 18 as Default
  become: true
  alternatives:
    name: clang-tidy
    path: /usr/bin/clang-tidy-18
    link: /usr/bin/clang-tidy
    priority: 180

- name: Setup Python Virtual Environment
  ansible.builtin.pip:
    name:
      # Installs from pyproject.toml
      - "{{ mrover_repo }}[dev]"
    virtualenv: "{{ mrover_repo }}/venv"
    virtualenv_command: /usr/bin/python3 -m venv

- name: Download Bun installer
  ansible.builtin.get_url:
    url: https://bun.sh/install
    dest: /tmp/bun_install.sh
    mode: '0755'

- name: Install or Upgrade Bun
  ansible.builtin.shell: /tmp/bun_install.sh
  args:
    executable: /bin/bash
  environment:
    BUN_INSTALL: "{{ ansible_env.HOME }}/.bun"

- name: Install Bun Packages
  ansible.builtin.command: "{{ ansible_env.HOME }}/.bun/bin/bun install"
  args:
    chdir: "{{ mrover_repo }}/teleoperation/basestation_gui/frontend"
