- name: Oh-My-Zsh
  git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: ~/.oh-my-zsh
    version: master

- name: Dotfiles
  synchronize:
    # The trailing slash is very important here
    # It tells rsync to copy only the CONTENTS of the folder and not the folder itself
    # This is vital to make sure this works will any usernames
    src: files/home/
    dest: ~/
    recursive: true
    # .zshrc is handled below instead of being overwritten outright, so a
    # user's own customizations to it survive re-runs
    rsync_opts:
      - "--exclude=.zshrc"

- name: Source mrover tmux config
  blockinfile:
    path: ~/.tmux.conf
    marker: "# {mark} MROVER"
    block: source-file ~/.mrover.tmux.conf
    create: true

- name: Source mrover zshenv
  blockinfile:
    path: ~/.zshenv
    marker: "# {mark} MROVER"
    block: source ~/ros2_ws/src/mrover/scripts/mrover.zshenv # hardcoded for now, change in re-arch
    create: true

- name: Check for existing zshrc
  stat:
    path: ~/.zshrc
  register: zshrc_stat

- name: Deploy default oh-my-zsh zshrc for fresh installs
  copy:
    src: files/home/.zshrc
    dest: ~/.zshrc
  when: not zshrc_stat.stat.exists

- name: ZSH Automatic Suggestions Plugin
  git:
    repo: https://github.com/zsh-users/zsh-autosuggestions
    dest: ~/.oh-my-zsh/custom/plugins/zsh-autosuggestions

- name: ZSH Syntax Highlighting Plugin
  git:
    repo: https://github.com/zsh-users/zsh-syntax-highlighting
    dest: ~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting

- name: Use ZSH as a default shell
  become: true
  command: chsh --shell /usr/bin/zsh {{ ansible_user_id }}

- name: GitHub CLI APT Key
  become: True
  apt_key:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    keyring: /usr/share/keyrings/githubcli-archive-keyring.gpg

- name: GitHub APT List
  become: True
  apt_repository:
    repo: deb [signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main
    filename: github-cli

- name: Add VSCode APT Key
  become: true
  apt_key:
    url: https://packages.microsoft.com/keys/microsoft.asc
    keyring: /usr/share/keyrings/packages.microsoft.gpg

- name: Add VSCode APT List
  become: true
  apt_repository:
    filename: vscode
    repo: "deb [arch=amd64,arm64,armhf signed-by=/usr/share/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main"

- name: Install APT Packages
  become: true
  apt:
    cache_valid_time: 604800
    state: latest
    name:
      - gh
      - code

- name: Install vscode debugger extension
  command: code --install-extension ../pkg/file-selector-0.0.1.vsix
