- name: Install platform-specific packages
  ansible.builtin.include_tasks: "{{ ansible_pkg_mgr }}.yml"

- name: Locate zsh binary
  ansible.builtin.command: which zsh
  register: zsh_path
  changed_when: false

- name: Set zsh as default shell
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: "{{ zsh_path.stdout }}"

- name: Install oh-my-zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: ~/.oh-my-zsh
    version: master

- name: Install zsh-autosuggestions
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-autosuggestions
    dest: ~/.oh-my-zsh/custom/plugins/zsh-autosuggestions

- name: Install zsh-syntax-highlighting
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-syntax-highlighting
    dest: ~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting

- name: Deploy mrover oh-my-zsh theme
  ansible.builtin.copy:
    src: files/home/.oh-my-zsh/custom/themes/mrover.zsh-theme
    dest: ~/.oh-my-zsh/custom/themes/mrover.zsh-theme

# EXCLUDES our own marked block before checking for omz
- name: Check for oh-my-zsh sourcing outside our managed block
  ansible.builtin.shell: |
    set -o pipefail
    awk '/# BEGIN MROVER OMZ/{skip=1} /# END MROVER OMZ/{skip=0; next} !skip' ~/.zshrc 2>/dev/null | grep -q "oh-my-zsh.sh"
  args:
    executable: /bin/bash
  register: omz_sourced_elsewhere
  changed_when: false
  failed_when: false

# append omz blockinfile
- name: Wire oh-my-zsh into zshrc
  ansible.builtin.blockinfile:
    path: ~/.zshrc
    marker: "# {mark} MROVER OMZ"
    block: |
      export ZSH="$HOME/.oh-my-zsh"
      ZSH_THEME="mrover"
      plugins=(git fzf zsh-autosuggestions zsh-syntax-highlighting)
      source $ZSH/oh-my-zsh.sh
    create: true
  when: omz_sourced_elsewhere.rc != 0

# zshenv depending on native/portable setup
- name: Wire mrover shell env
  ansible.builtin.blockinfile:
    path: ~/.zshrc
    marker: "# {mark} MROVER"
    block: '[[ -f "{{ mrover_repo }}/{{ mrover_zshenv }}" ]] && source "{{ mrover_repo }}/{{ mrover_zshenv }}"'
    create: true

# TODO (kevin): non-destructive method?
- name: Deploy mrover tmux config
  ansible.builtin.copy:
    src: files/home/.mrover.tmux.conf
    dest: ~/.mrover.tmux.conf

- name: Source mrover tmux config
  ansible.builtin.blockinfile:
    path: ~/.tmux.conf
    marker: "# {mark} MROVER"
    block: source-file ~/.mrover.tmux.conf
    create: true

- name: Initialize Git LFS
  ansible.builtin.command: git lfs install
  args:
    chdir: "{{ mrover_repo }}"

- name: Pull Git LFS objects
  ansible.builtin.command: git lfs pull
  args:
    chdir: "{{ mrover_repo }}"

- name: Initialize Git submodules
  ansible.builtin.command: git submodule update --init --recursive
  args:
    chdir: "{{ mrover_repo }}"

- name: Locate VSCode CLI
  ansible.builtin.command: which code
  register: code_path
  changed_when: false
  failed_when: false

# a manually installed VSCode on macOS does not put code on PATH
- name: Install VSCode extension
  ansible.builtin.command: code --install-extension {{ mrover_repo }}/pkg/file-selector-0.0.1.vsix
  when: code_path.rc == 0
