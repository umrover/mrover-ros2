- name: Install platform-specific packages
  ansible.builtin.include_tasks: "{{ ansible_pkg_mgr }}.yml"

- name: Ensure pixi bin directory exists (Linux)
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.pixi/bin"
    state: directory
    mode: '0755'
  when: ansible_system == 'Linux'

- name: Install pixi (Linux)
  ansible.builtin.get_url:
    url: "https://github.com/prefix-dev/pixi/releases/latest/download/pixi-{{ ansible_architecture }}-unknown-linux-musl"
    dest: "{{ ansible_env.HOME }}/.pixi/bin/pixi"
    mode: '0755'
    force: false
  when: ansible_system == 'Linux'

- name: Update git submodules
  ansible.builtin.command:
    cmd: git submodule update --init
    chdir: "{{ mrover_repo }}"

- name: Install oh-my-zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: ~/.oh-my-zsh
    version: master

- name: Install zsh-autosuggestions
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-autosuggestions
    dest: ~/.oh-my-zsh/custom/plugins/zsh-autosuggestions

- name: Install zsh-syntax-highlighting
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-syntax-highlighting
    dest: ~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting

- name: Deploy mrover oh-my-zsh theme
  ansible.builtin.copy:
    src: files/home/.oh-my-zsh/custom/themes/mrover.zsh-theme
    dest: ~/.oh-my-zsh/custom/themes/mrover.zsh-theme

- name: Deploy mrover tmux config
  ansible.builtin.copy:
    src: files/home/.mrover.tmux.conf
    dest: ~/.mrover.tmux.conf

- name: Source mrover tmux config
  ansible.builtin.blockinfile:
    path: ~/.tmux.conf
    marker: "# {mark} MROVER"
    block: source-file ~/.mrover.tmux.conf
    create: true

- name: Set zsh as default shell
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /usr/bin/zsh

- name: Wire mrover shell env
  ansible.builtin.blockinfile:
    path: ~/.zshrc
    marker: "# {mark} MROVER"
    block: '[[ -f "${MROVER_REPO:-$HOME/mrover-ros2}/tools/mrover.zshenv" ]] && source "${MROVER_REPO:-$HOME/mrover-ros2}/tools/mrover.zshenv"'
    create: true

# - name: Remove legacy mrover zshenv wiring
#   ansible.builtin.blockinfile:
#     path: ~/.zshenv
#     marker: "# {mark} MROVER"
#     state: absent

- name: Initialize Git LFS
  ansible.builtin.command: git lfs install
  args:
    chdir: "{{ mrover_repo }}"

- name: Pull Git LFS objects
  ansible.builtin.command: git lfs pull
  args:
    chdir: "{{ mrover_repo }}"

- name: Install pixi packages
  ansible.builtin.command:
    cmd: pixi install
    chdir: "{{ mrover_repo }}"
  environment:
    PATH: "{{ ansible_env.HOME }}/.pixi/bin:{{ ansible_env.PATH }}"

- name: Install VSCode extension
  ansible.builtin.command: code --install-extension {{ mrover_repo }}/pkg/file-selector-0.0.1.vsix
